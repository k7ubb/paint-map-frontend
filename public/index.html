<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" type="text/css" href="app.css?<!--BUILD_TIMESTAMP-->">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<title>マップを編集 - ペイントマップ</title>
</head>

<body>
	<header>
		<a href="/"></a>
		<h1 id="map_title"></h1>
	</header>

	<main>
		<div id="leaflet" class="loading"></div>
		<div id="tooltip">
			<div id="tooltip_cityname"></div>
			<div id="tooltip_buttons"></div>
		</div>
		<details class="sidemenu" open>
			<summary></summary>
			<div>
				<div class="legend" id="legend"></div>
				<hr>
				
				<p class="links">
					<a href="/" target="_blank"><i class="fa-solid fa-house"></i> このサイトについて</a><br>
					<a href="/manual/" target="_blank"><i class="fa-regular fa-circle-question"></i> マニュアル</a>
				</p>
			</div>
		</details>
	</main>

	<dialog id="error_dialog">
		<div>
			<div class="flex">
				<i class="fa-solid fa-triangle-exclamation"></i>
				<div>
					<h2 id="error_dialog_message"></h2>
					<p id="error_dialog_description"></p>
				</div>
			</div>
			<button class="common_button dialog_close_button" id="error_dialog_close_button">OK</button>
			</div>
		</div>
	</dialog>

	<script type="module" src="src/index.js?<!--BUILD_TIMESTAMP-->"></script>
</body>
</html>
