<!DOCTYPE html>
<html lang="ja" prefix="og: http://ogp.me/ns#">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="都道府県・市町村などの地図を色塗りできるWebアプリ">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" type="text/css" href="app.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<meta property="og:title" content="ペイントマップ">
<meta property="og:description" content="都道府県・市町村などの地図を色塗りできるWebアプリ">
<meta property="og:site_name" content="paint-map.com">
<!--#exec cgi=".cgi/ogp.cgi"-->
<meta name="twitter:card" content="summary_large_image">
<meta name="format-detection" content="telephone=no">
<title></title>
</head>

<body class="share">
	<header>
		<a href="/"></a>
		<h1 id="map_title"></h1>
		<a href="" id="iframe_break"></a>
	</header>

	<main>
		<div id="leaflet" class="loading"></div>
		<div id="tooltip">
			<div id="tooltip_cityname"></div>
			<div id="tooltip_legend"></div>
		</div>
		<details class="floatmenu" open>
			<summary></summary>
			<div>
				<div class="legend" id="legend"></div>
				<hr>
				<p id="description"></p>
			</div>
		</details>
	</main>

	<dialog id="error_dialog">
		<div>
			<div class="flex">
				<i class="fa-solid fa-triangle-exclamation"></i>
				<div>
					<h2 id="error_dialog_message"></h2>
					<p id="error_dialog_description"></p>
				</div>
			</div>
			<button class="common_button dialog_close_button" id="error_dialog_close_button">OK</button>
		</div>
	</dialog>

	<script type="module" src="src/share.js"></script>
</body>
</html>
